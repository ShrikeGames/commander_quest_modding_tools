name: Build and release

# Packaged builds are produced on the platform they target, because PyInstaller
# bundles the running interpreter and cannot cross-compile. Pushing a v* tag
# builds both and publishes them as a release; every other run just proves the
# packaging still works.
on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            archive: CommanderQuestModTool-linux-x86_64.tar.gz
          - os: windows-latest
            label: windows
            archive: CommanderQuestModTool-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Linux runner has gcc already. The Windows runner needs a compiler
      # for the two native pieces, and MinGW builds both without MSVC.
      - name: Install MinGW
        if: matrix.label == 'windows'
        run: choco install mingw --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Record the toolchain
        shell: bash
        run: |
          echo "PATH=$PATH"
          which gcc g++ || true
          gcc --version || true
          g++ --version || true

      # The compiler output is copied into the run summary on failure, because
      # a build that breaks only on one platform is otherwise invisible to
      # anyone who cannot open the raw logs.
      - name: Build the native decoder and key scanner
        id: native
        shell: bash
        run: |
          set -o pipefail
          python tools/build_native.py 2>&1 | tee native-build.log

      - name: Report a native build failure
        if: failure() && steps.native.conclusion == 'failure'
        shell: bash
        run: |
          {
            echo "## Native build failed on ${{ matrix.label }}"
            echo ''
            echo '```'
            tail -80 native-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package the application
        run: pyinstaller --noconfirm packaging/cqmod.spec

      # Packaging cleanly says nothing about whether the result starts. A
      # bundle missing one DLL fails at launch naming the extension that could
      # not load rather than the library that was absent, so the imports are
      # audited here instead of on a user's machine.
      - name: Audit bundled dependencies
        if: matrix.label == 'windows'
        id: audit
        shell: bash
        run: |
          set -o pipefail
          python tools/check_bundle.py dist/CommanderQuestModTool 2>&1 | tee audit.log

      - name: Report the dependency audit
        if: always() && matrix.label == 'windows' && steps.audit.outcome != 'skipped'
        shell: bash
        run: |
          {
            echo "## Windows dependency audit"
            echo ''
            echo '```'
            tail -60 audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add the readme users see first
        shell: bash
        run: cp packaging/README-package.txt dist/CommanderQuestModTool/README.txt

      - name: Create the archive
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.label }}" = "windows" ]; then
            7z a -tzip "../${{ matrix.archive }}" CommanderQuestModTool
          else
            tar czf "../${{ matrix.archive }}" CommanderQuestModTool
          fi

      - name: Check the build actually starts
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
          # Exit 124 means it was still running when the timeout fired, which is
          # what a GUI that started correctly does.
          QT_QPA_PLATFORM=offscreen timeout 30 \
            ./dist/CommanderQuestModTool/CommanderQuestModTool || \
            test $? -eq 124

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Writing the notes into the tag keeps them with the commit they describe,
      # rather than in a box that only exists on the release page.
      #
      # The message is read through the API rather than from the checkout.
      # actions/checkout creates a lightweight tag pointing at the commit, so
      # git's own %(contents) yields the commit message instead of the
      # annotation, which is a silent wrong answer rather than an error.
      - name: Take the release notes from the tag
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
                  --jq 'select(.object.type == "tag") | .object.sha' || true)
          if [ -n "$sha" ]; then
            # Drop the subject line: GitHub already titles the release with it.
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' \
              | tail -n +2 | sed '/./,$!d' > notes.md
          else
            echo "tag $GITHUB_REF_NAME is not annotated; no notes" >&2
            : > notes.md
          fi
          {
            echo "text<<CQMOD_NOTES_EOF"
            cat notes.md
            echo "CQMOD_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          body: |
            ${{ steps.notes.outputs.text }}

            ## Installing

            Download the archive for your platform, unpack it anywhere, and run
            **CommanderQuestModTool**. Nothing is installed and no Python,
            compiler or other setup is needed.

            On first launch the tool asks where Commander Quest is (it usually
            finds it on its own) and for the archive key. The game builds that
            key while it runs, so start the game, wait for the main menu, and
            press **Recover key from the running game**. It is the same key for
            everyone on a given version and is only needed again if a patch
            changes it.

            Linux users may need to allow reading the game's memory for that one
            step: `sudo sysctl -w kernel.yama.ptrace_scope=0`. Windows users may
            need to run the tool as administrator for it.
